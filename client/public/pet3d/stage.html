<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Doluruu Stage</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;-webkit-user-select:none;user-select:none;touch-action:none}</style>
  <script src="libs/laya.core.js"></script>
  <script src="libs/laya.d3.js"></script>
  <script src="libs/laya.gltf.js"></script>
  <script src="libs/laya.webgl_2D.js"></script>
  <script src="libs/laya.webgl_3D.js"></script>
</head>
<body>
<script>
const L = Laya;
const { Stage, Scene3D, Camera, Sprite3D, DirectionLightCom, MeshSprite3D, PrimitiveMesh,
        PBRStandardMaterial, UnlitMaterial, Vector3, Color, Event, Loader, Handler } = L;
const col = (hex, a) => { const n = parseInt(hex.slice(1), 16); return new Color(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255, a === undefined ? 1 : a); };
const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return { r: ((n>>16)&255)/255, g: ((n>>8)&255)/255, b: (n&255)/255 }; };
const mat = (hex, smooth) => { const m = new PBRStandardMaterial(); m.albedoColor = col(hex); try { m.metallic = 0; m.smoothness = smooth === undefined ? 0.25 : smooth; } catch(e){} return m; };
const umat = (hex, a) => { const m = new UnlitMaterial(); m.albedoColor = col(hex, a); if (a !== undefined && a < 1) { try { m.renderMode = UnlitMaterial.RENDERMODE_TRANSPARENT; } catch(e){} } return m; };
const setPos = (n,x,y,z)=>{ n.transform.localPosition = new Vector3(x,y,z); };
const setRot = (n,x,y,z)=>{ n.transform.localRotationEuler = new Vector3(x,y,z); };
const setScl = (n,x,y,z)=>{ n.transform.localScale = new Vector3(x,y,z); };
const lerp = (a,b,k)=>a+(b-a)*k;

const M = {};
let scene, camera, hero, sunNode, sunCom, fillCom, celestial, celMat, cloudMat, blobShadow, blobMat;
let clouds = [], fireflies = [], stars = [], bubbles = [];
const S = { t: 0, action: "idle", actT: 0, jumpT: -1, sleeping: false, sick: false, ready: false };

// Per-phase atmosphere: sky/fog colour, ambient, sun colour+direction, clouds, celestial body.
const ENV = {
  day:   { sky:"#bfe9ff", fog:"#d8f1ff", amb:"#9fb3c2", sun:"#fff7e6", sunI:1.15, dir:[-0.45,-1.0,-0.55], cel:[6,8.5,-16],  celC:"#fff2ad", celS:1.5, cloud:"#ffffff", night:0 },
  dawn:  { sky:"#ffd9b0", fog:"#ffe7cd", amb:"#c7a58e", sun:"#ffc287", sunI:1.0,  dir:[-0.9,-0.45,-0.35], cel:[-8,3.2,-16], celC:"#ffcf80", celS:1.9, cloud:"#ffe9d2", night:0 },
  dusk:  { sky:"#f0b3c8", fog:"#f7cfdc", amb:"#b393a4", sun:"#ff9d7a", sunI:0.9,  dir:[0.9,-0.4,-0.35],  cel:[8,2.8,-16],  celC:"#ffb36b", celS:1.9, cloud:"#f7d9e0", night:0 },
  night: { sky:"#232852", fog:"#2c3162", amb:"#3d4468", sun:"#8493d9", sunI:0.45, dir:[-0.3,-1.0,-0.4],  cel:[7,8,-15],    celC:"#eef3ff", celS:1.2, cloud:"#8a92c4", night:1 },
};
let envCur = null, envTgt = null;

L.init(0,0).then(start).catch((e)=>console.error(e));

function start() {
  L.stage.scaleMode = Stage.SCALE_FULL; L.stage.screenMode = Stage.SCREEN_NONE; L.stage.bgColor = "#bfe9ff";
  scene = L.stage.addChild(new Scene3D());
  try { scene.ambientMode = L.AmbientMode.SolidColor; } catch(e){}
  try { scene.enableFog = true; scene.fogStart = 10; scene.fogEnd = 34; } catch(e){}

  camera = scene.addChild(new Camera(0, 0.1, 100));
  setPos(camera, 0, 2.15, 5.7); setRot(camera, -11, 0, 0);
  try { camera.fieldOfView = 42; } catch(e){}
  camera.clearColor = col(ENV.day.sky);

  // Key light (sun) with soft shadows + cool fill so shaded sides stay readable.
  sunNode = scene.addChild(new Sprite3D()); sunCom = sunNode.addComponent(DirectionLightCom);
  try { sunCom.shadowMode = L.ShadowMode.SoftLow; sunCom.shadowDistance = 22; sunCom.shadowResolution = 1024; sunCom.shadowStrength = 0.62; try { sunCom.shadowNormalBias = 2; } catch(e){} } catch(e){ console.warn("shadows unavailable", e); }
  const fill = scene.addChild(new Sprite3D()); fillCom = fill.addComponent(DirectionLightCom);
  try { fillCom.color = new Color(0.38,0.44,0.55,1); } catch(e){}
  const fm = fill.transform.worldMatrix; fm.setForward(new Vector3(0.6,-0.2,0.6)); fill.transform.worldMatrix = fm;

  Object.assign(M, {
    grass: mat("#79c45f", 0.12), grassDark: mat("#63b04e", 0.12), path: mat("#e8d9a8", 0.15),
    matC: mat("#7bd3ef", 0.3), matRim: mat("#4fb3d9", 0.3),
    trunk: mat("#8a5c38", 0.15), leaf: mat("#3fae4f", 0.18), leaf2: mat("#59c463", 0.18), leaf3: mat("#2f9648", 0.18), pine: mat("#2e8f5b", 0.18),
    bowl: mat("#ff8f3f", 0.45), bowlIn: mat("#c96a24", 0.3), kibble: mat("#a3672e", 0.2),
    ball: mat("#ff5a5f", 0.7), ballDot: mat("#ffffff", 0.7),
    rock: mat("#9aa0a8", 0.2), rock2: mat("#b4b9c0", 0.2),
    stem: mat("#4a9e3f", 0.15), petalP: mat("#ff8fc0", 0.35), petalY: mat("#ffd75e", 0.35), petalW: mat("#ffffff", 0.35), center: mat("#ff9d2e", 0.4),
    hillNear: mat("#8fce76", 0.1), hillFar: mat("#a9d9c2", 0.1),
  });
  celMat = umat("#fff2ad"); cloudMat = umat("#ffffff", 0.94);
  buildScene();
  setEnv("day", true);

  L.loader.load("doluruu.glb").then(() => {
    hero = new Sprite3D(); scene.addChild(hero);
    let model;
    try { model = Loader.createNodes("doluruu.glb"); } catch (e) { console.error("createNodes", e); }
    if (model) {
      hero.addChild(model);
      setRot(model, -90, 0, 0);      // Z-up → Y-up; front (-Y) now faces +Z (camera)
      setPos(model, -0.10, 0, 0);    // centre it on X
      paintByName(model);
    } else console.error("model is null after load");
    // Soft contact blob under the pet — grounds it even mid-jump.
    blobMat = umat("#1e3a1a", 0.28);
    blobShadow = scene.addChild(new MeshSprite3D(PrimitiveMesh.createCylinder(1.0, 0.02, 24)));
    blobShadow.meshRenderer.material = blobMat; try { blobShadow.meshRenderer.receiveShadow = false; } catch(e){}
    setPos(blobShadow, 0, 0.125, -0.5);   // just above the mat pad so it stays visible
    S.ready = true;
    L.timer.frameLoop(1, null, update);
  }).catch((e) => console.error("glb load failed", e));

  L.stage.on(Event.MOUSE_DOWN, null, () => { if (S.ready && !S.sleeping) { S.action = "play"; S.actT = 0; S.jumpT = 0; } try { parent.postMessage({ __pet3d: true, type: "poke" }, "*"); } catch(e){} });
  window.addEventListener("message", (e) => {
    const d = e.data || {}; if (!d || !d.__pet3d) return;
    if (d.type === "act") { const a = d.action; if (a === "wake") { S.sleeping = false; S.action = "idle"; } else if (a === "sleep") { S.sleeping = true; S.action = "sleep"; } else { S.action = a; S.actT = 0; if (a === "play") S.jumpT = 0; } }
    if (d.type === "state") { S.sleeping = !!d.sleeping; S.sick = !!d.sick; if (S.sleeping && S.action === "idle") S.action = "sleep"; }
    if (d.type === "phase" && ENV[d.phase]) setEnv(d.phase);
  });
  try { parent.postMessage({ __pet3d: true, type: "ready" }, "*"); } catch(e){}
}

// The glTF import drops vertex colors, but every part is named — so paint each
// part with the correct Doluruu palette (lit PBR, cached per colour).
const _matCache = {};
function pmat(hex) { if (_matCache[hex]) return _matCache[hex]; const m = new PBRStandardMaterial(); m.albedoColor = col(hex); try { m.metallic = 0; m.smoothness = 0.3; } catch(e){} return (_matCache[hex] = m); }
function colorFor(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("belly_border")) return "#2f8f6b";
  if (n.includes("belly") || n.includes("upper_plate")) return "#f0cf8d";
  if (n.includes("shell_rim")) return "#553872";
  if (n.includes("shell")) return "#6b4a8c";
  if (n.includes("eye_white") || n.includes("glint")) return "#ffffff";
  if (n.includes("iris")) return "#1f7a68";
  if (n.includes("pupil")) return "#141414";
  if (n.includes("forehead")) return "#d9542f";
  if (n.includes("head_spike")) { const i = parseInt(n.replace(/[^0-9]/g, "")) || 0; return ["#e0673a","#e8c15a","#2fae9e","#d9542f","#e8c15a","#2fae9e"][i % 6]; }
  if (n.includes("tail_spike")) { const i = parseInt(n.replace(/[^0-9]/g, "")) || 0; return ["#e0673a","#2fae9e","#6b4a8c"][i % 3]; }
  if (n.includes("nostril")) return "#201f1b";
  if (n.includes("brow")) return "#2a2925";
  return "#3c3b36"; // body default (charcoal)
}
function paintByName(node) {
  let r = null; try { r = node.getComponent(L.MeshRenderer); } catch (e) {}
  if (r) { try { r.sharedMaterial = pmat(colorFor(node.name)); r.castShadow = true; } catch (e) { console.error("paint", e); } }
  const n = node.numChildren || 0;
  for (let i = 0; i < n; i++) paintByName(node.getChildAt(i));
}

function box(p,m,w,h,d){const s=p.addChild(new MeshSprite3D(PrimitiveMesh.createBox(w,h,d)));s.meshRenderer.material=m;shadow(s);return s;}
function sph(p,m,r,seg){const s=p.addChild(new MeshSprite3D(PrimitiveMesh.createSphere(r,seg||14,seg||14)));s.meshRenderer.material=m;shadow(s);return s;}
function cyl(p,m,r,h,seg){const s=p.addChild(new MeshSprite3D(PrimitiveMesh.createCylinder(r,h,seg||20)));s.meshRenderer.material=m;shadow(s);return s;}
function cone(p,m,r,h){const s=p.addChild(new MeshSprite3D(PrimitiveMesh.createCone(r,h,18)));s.meshRenderer.material=m;shadow(s);return s;}
function shadow(s){ try { s.meshRenderer.castShadow = true; s.meshRenderer.receiveShadow = true; } catch(e){} }

function tree(x,z,s){ s=s||1; const t=scene.addChild(new Sprite3D()); setPos(t,x,0,z); setScl(t,s,s,s);
  const tr=cyl(t,M.trunk,0.22,1.5,10); setPos(tr,0,0.75,0);
  const a=sph(t,M.leaf,1.1); setPos(a,0,2.15,0); setScl(a,1,0.85,1);
  const b=sph(t,M.leaf2,0.75); setPos(b,0.55,2.75,0.15);
  const c=sph(t,M.leaf3,0.6); setPos(c,-0.55,2.6,-0.1); }
function pineTree(x,z,s){ s=s||1; const t=scene.addChild(new Sprite3D()); setPos(t,x,0,z); setScl(t,s,s,s);
  const tr=cyl(t,M.trunk,0.18,1.0,10); setPos(tr,0,0.5,0);
  const a=cone(t,M.pine,1.0,1.4); setPos(a,0,1.5,0);
  const b=cone(t,M.pine,0.75,1.2); setPos(b,0,2.35,0);
  const c=cone(t,M.pine,0.5,1.0); setPos(c,0,3.1,0); }
function bush(x,z,s){ s=s||1; const t=scene.addChild(new Sprite3D()); setPos(t,x,0,z); setScl(t,s,s,s);
  const a=sph(t,M.leaf2,0.5); setPos(a,0,0.4,0); setScl(a,1,0.8,1);
  const b=sph(t,M.leaf,0.38); setPos(b,0.42,0.32,0.1); setScl(b,1,0.8,1); }
function flower(x,z,petal){ const t=scene.addChild(new Sprite3D()); setPos(t,x,0,z);
  const st=cyl(t,M.stem,0.03,0.35,8); setPos(st,0,0.17,0);
  const h=sph(t,petal,0.11,10); setPos(h,0,0.38,0); setScl(h,1.4,0.6,1.4);
  const c=sph(t,M.center,0.06,8); setPos(c,0,0.42,0); }
function rock(x,z,s,m){ const r=sph(scene,m,0.4,12); setPos(r,x,0.12*s,z); setScl(r,s,0.6*s,0.8*s); }
function hill(x,y,z,sx,sy,m){ const h=sph(scene,m,4,16); setPos(h,x,y,z); setScl(h,sx,sy,1.6); try{h.meshRenderer.castShadow=false;}catch(e){} }
function cloud(x,y,z,s){ const c=scene.addChild(new Sprite3D()); setPos(c,x,y,z);
  [[0,0,0,0.55],[0.55,0.08,0.05,0.42],[-0.5,0.05,-0.05,0.4],[0.2,0.28,0,0.38],[-0.2,0.25,0.05,0.34]].forEach(p=>{
    const b=c.addChild(new MeshSprite3D(PrimitiveMesh.createSphere(p[3]*s,10,10))); b.meshRenderer.material=cloudMat;
    try{b.meshRenderer.castShadow=false;b.meshRenderer.receiveShadow=false;}catch(e){} setPos(b,p[0]*s,p[1]*s,p[2]*s); setScl(b,1.25,0.8,1); });
  clouds.push({ node:c, speed:0.14+Math.random()*0.12, y }); return c; }

function buildScene() {
  // Ground: soft grass plane + darker apron so the horizon line isn't a hard edge.
  const g = scene.addChild(new MeshSprite3D(PrimitiveMesh.createPlane(80,80,1,1))); g.meshRenderer.material = M.grass;
  try { g.meshRenderer.receiveShadow = true; g.meshRenderer.castShadow = false; } catch(e){}
  setPos(g, 0, 0, -10);
  // Rolling hills on the horizon (fog fades them for depth).
  hill(-10, -0.6, -20, 3.2, 0.9, M.hillNear); hill(9, -0.8, -22, 3.6, 1.0, M.hillNear);
  hill(0, -1.0, -26, 4.5, 1.1, M.hillFar);  hill(-17, -0.9, -25, 3.0, 0.9, M.hillFar); hill(17, -1.1, -26, 3.4, 1.0, M.hillFar);
  // Pet mat: rim + inner pad.
  const rim = cyl(scene, M.matRim, 2.35, 0.08, 36); setPos(rim, 0, 0.04, 0.1); try{rim.meshRenderer.castShadow=false;}catch(e){}
  const pad = cyl(scene, M.matC, 2.15, 0.1, 36); setPos(pad, 0, 0.06, 0.1); try{pad.meshRenderer.castShadow=false;}catch(e){}
  // Trees & bushes framing the stage.
  tree(-3.9,-3.2); tree(3.8,-3.9,0.9); pineTree(-6.2,-6.0,1.1); pineTree(5.6,-6.4); tree(-8.5,-9,1.3); tree(8.5,-9.5,1.2);
  bush(-2.6,-2.2,0.9); bush(2.9,-2.5); bush(-5.4,-4.4,1.2); bush(4.8,-4.6,0.8);
  // Flowers + rocks scattered around.
  flower(-1.6,1.6,M.petalP); flower(1.8,1.5,M.petalY); flower(-3.2,-0.8,M.petalW); flower(3.4,-1.2,M.petalP); flower(-4.6,-2.6,M.petalY); flower(4.4,-2.9,M.petalW); flower(0.6,2.1,M.petalY);
  rock(-3.0,0.6,0.8,M.rock); rock(3.2,0.2,0.6,M.rock2); rock(-5.8,-3.4,1.2,M.rock2); rock(6.0,-3.0,0.9,M.rock);
  // Food bowl with kibble.
  const bw = cyl(scene, M.bowl, 0.5, 0.32, 24); setPos(bw, -2.5, 0.16, 0.1);
  const bi = cyl(scene, M.bowlIn, 0.4, 0.06, 20); setPos(bi, -2.5, 0.31, 0.1); try{bi.meshRenderer.castShadow=false;}catch(e){}
  [[-2.6,0.15],[-2.4,0.08],[-2.5,0.02]].forEach((p,i)=>{ const k=sph(scene,M.kibble,0.07,8); setPos(k,p[0],0.36,p[1]); });
  // Glossy ball with a white dot.
  const b = sph(scene, M.ball, 0.42, 18); setPos(b, 2.6, 0.42, -0.6);
  const d = sph(scene, M.ballDot, 0.16, 10); setPos(d, 2.72, 0.62, -0.32);
  // Clouds drifting across the sky.
  cloud(-6, 6.5, -14, 1.3); cloud(4, 7.5, -16, 1.6); cloud(9, 5.8, -13, 1.0); cloud(-11, 7.2, -17, 1.4);
  // Celestial body (sun by day, moon by night).
  celestial = scene.addChild(new MeshSprite3D(PrimitiveMesh.createSphere(1, 14, 14))); celestial.meshRenderer.material = celMat;
  try { celestial.meshRenderer.castShadow = false; celestial.meshRenderer.receiveShadow = false; } catch(e){}
  // Night-only extras: stars + drifting fireflies.
  for (let i = 0; i < 14; i++) { const st = scene.addChild(new MeshSprite3D(PrimitiveMesh.createSphere(0.06+Math.random()*0.05,6,6)));
    st.meshRenderer.material = umat("#ffffff", 0.9); try{st.meshRenderer.castShadow=false;}catch(e){}
    setPos(st, -14+Math.random()*28, 5+Math.random()*6, -18-Math.random()*4); st.active = false; stars.push(st); }
  for (let i = 0; i < 5; i++) { const f = scene.addChild(new MeshSprite3D(PrimitiveMesh.createSphere(0.05,8,8)));
    f.meshRenderer.material = umat("#ffe98a"); try{f.meshRenderer.castShadow=false;}catch(e){}
    f.active = false; fireflies.push({ node: f, ph: Math.random()*Math.PI*2, x: -3+Math.random()*6, z: -1+Math.random()*3 }); }
  // Bubble pool for bath time.
  for (let i = 0; i < 7; i++) { const bb = scene.addChild(new MeshSprite3D(PrimitiveMesh.createSphere(0.09+Math.random()*0.06,10,10)));
    bb.meshRenderer.material = umat("#cfeeff", 0.5); try{bb.meshRenderer.castShadow=false;}catch(e){}
    bb.active = false; bubbles.push({ node: bb, ph: Math.random()*1.4, x: -0.8+Math.random()*1.6 }); }
}

function envState(p) { const e = ENV[p]; return { sky: rgb(e.sky), fog: rgb(e.fog), amb: rgb(e.amb), sun: rgb(e.sun), sunI: e.sunI, dir: e.dir.slice(), cel: e.cel.slice(), celC: rgb(e.celC), celS: e.celS, cloud: rgb(e.cloud), night: e.night }; }
function setEnv(phase, instant) {
  envTgt = envState(phase);
  if (instant || !envCur) { envCur = envState(phase); applyEnv(); }
  const isNight = phase === "night";
  stars.forEach(s => s.active = isNight);
  fireflies.forEach(f => f.node.active = isNight);
}
function applyEnv() {
  const e = envCur;
  camera.clearColor = new Color(e.sky.r, e.sky.g, e.sky.b, 1);
  try { scene.fogColor = new Color(e.fog.r, e.fog.g, e.fog.b, 1); } catch(err){}
  try { scene.ambientColor = new Color(e.amb.r, e.amb.g, e.amb.b, 1); } catch(err){}
  try { sunCom.color = new Color(e.sun.r*e.sunI, e.sun.g*e.sunI, e.sun.b*e.sunI, 1); } catch(err){}
  const m = sunNode.transform.worldMatrix; m.setForward(new Vector3(e.dir[0], e.dir[1], e.dir[2])); sunNode.transform.worldMatrix = m;
  if (celestial) { setPos(celestial, e.cel[0], e.cel[1], e.cel[2]); setScl(celestial, e.celS, e.celS, e.celS);
    celMat.albedoColor = new Color(e.celC.r, e.celC.g, e.celC.b, 1); }
  cloudMat.albedoColor = new Color(e.cloud.r, e.cloud.g, e.cloud.b, 0.94);
}
function lerpEnv(dt) {
  if (!envTgt || !envCur) return;
  const k = 1 - Math.exp(-dt * 2.2);
  ["sky","fog","amb","sun","celC","cloud"].forEach(key => { const a = envCur[key], b = envTgt[key]; a.r=lerp(a.r,b.r,k); a.g=lerp(a.g,b.g,k); a.b=lerp(a.b,b.b,k); });
  envCur.sunI = lerp(envCur.sunI, envTgt.sunI, k); envCur.celS = lerp(envCur.celS, envTgt.celS, k);
  for (let i=0;i<3;i++){ envCur.dir[i]=lerp(envCur.dir[i],envTgt.dir[i],k); envCur.cel[i]=lerp(envCur.cel[i],envTgt.cel[i],k); }
  applyEnv();
}

function update() {
  if (!S.ready) return;
  let dt = L.timer.delta/1000; if (dt>0.05) dt=0.05;
  S.t += dt;
  if (S.action!=="idle" && S.action!=="sleep"){ S.actT+=dt; if (S.actT>1.4){ S.action = S.sleeping ? "sleep" : "idle"; S.actT=0; } }
  lerpEnv(dt);
  // Ambient life: drifting clouds, fireflies, bath bubbles.
  clouds.forEach(c => { const p = c.node.transform.localPosition; let x = p.x + c.speed*dt; if (x > 16) x = -16; setPos(c.node, x, c.y, p.z); });
  fireflies.forEach(f => { if (!f.node.active) return; f.ph += dt;
    setPos(f.node, f.x + Math.sin(f.ph*0.9)*0.6, 0.6 + Math.sin(f.ph*1.3)*0.35, f.z + Math.cos(f.ph*0.7)*0.5); });
  const bathing = S.action === "bath";
  bubbles.forEach(b => { b.node.active = bathing; if (!bathing) { b.ph = Math.random()*1.4; return; }
    b.ph += dt; if (b.ph > 1.4) { b.ph = 0; b.x = -0.8+Math.random()*1.6; }
    setPos(b.node, b.x + Math.sin(b.ph*4)*0.1, 0.3 + b.ph*1.3, 0.2); const s = Math.max(0.05, 1 - b.ph/1.4); setScl(b.node, s, s, s); });
  animate(dt);
}
function animate(dt) {
  let bobY = Math.sin(S.t*2.1)*0.045;             // gentle breathing bob
  let swayY = Math.sin(S.t*0.6)*7;                // look side to side
  let rockZ = Math.sin(S.t*0.85)*1.2, leanX = 0, jump = 0;
  let sy = 1 + Math.sin(S.t*2.1)*0.025, sx = 1;

  if (S.action==="feed"){ swayY = -24 + Math.sin(S.actT*3)*4; leanX = 8 + Math.sin(S.actT*14)*7; bobY += Math.abs(Math.sin(S.actT*14))*0.05; }
  if (S.action==="play"){
    if (S.jumpT>=0){ S.jumpT+=L.timer.delta; const p=Math.min(1,S.jumpT/1400); jump=Math.abs(Math.sin(p*Math.PI*2))*0.38; if(p>=1)S.jumpT=-1;
      sy = 0.86 + Math.min(1, jump/0.3)*0.3; sx = 1 + (1-sy)*0.7; }   // squash on the ground, stretch in the air
    swayY=Math.sin(S.actT*10)*22; rockZ=Math.sin(S.actT*12)*6; }
  if (S.action==="bath"){ rockZ=Math.sin(S.actT*26)*8; sx = 1 + Math.sin(S.actT*26)*0.04; }
  if (S.action==="sleep" || S.sleeping){ rockZ=-16; swayY=22; bobY=-0.1+Math.sin(S.t*1.3)*0.02; sy=1+Math.sin(S.t*1.3)*0.02; sx=1; leanX=0; jump=0; }
  else if (S.sick && S.action==="idle"){ rockZ=-5+Math.sin(S.t*0.7)*1; swayY=Math.sin(S.t*0.4)*3; bobY=Math.sin(S.t*1.4)*0.025; leanX=4; }

  setPos(hero, 0, 0.0 + bobY + jump, -0.5);
  setRot(hero, leanX, swayY, rockZ);
  setScl(hero, 1.3*sx, 1.3*sy, 1.3*sx);
  if (blobShadow) { const k = Math.max(0.45, 1 - jump*0.8); setScl(blobShadow, k, 1, k);
    try { blobMat.albedoColor = new Color(0.12, 0.22, 0.1, 0.28*k); } catch(e){} }
}
</script>
