<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Doluruu Stage</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;-webkit-user-select:none;user-select:none;touch-action:none}</style>
  <script src="libs/laya.core.js"></script>
  <script src="libs/laya.d3.js"></script>
  <script src="libs/laya.gltf.js"></script>
  <script src="libs/laya.webgl_2D.js"></script>
  <script src="libs/laya.webgl_3D.js"></script>
</head>
<body>
<script>
const L = Laya;
const { Stage, Scene3D, Camera, Sprite3D, DirectionLightCom, MeshSprite3D, PrimitiveMesh,
        PBRStandardMaterial, UnlitMaterial, Vector3, Color, Event, Loader, Handler } = L;
const col = (hex) => { const n = parseInt(hex.slice(1), 16); return new Color(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255, 1); };
const mat = (hex) => { const m = new PBRStandardMaterial(); m.albedoColor = col(hex); try { m.metallic = 0; m.smoothness = 0.2; } catch(e){} return m; };
const setPos = (n,x,y,z)=>{ n.transform.localPosition = new Vector3(x,y,z); };
const setRot = (n,x,y,z)=>{ n.transform.localRotationEuler = new Vector3(x,y,z); };
const setScl = (n,x,y,z)=>{ n.transform.localScale = new Vector3(x,y,z); };

const M = {};
let scene, camera, hero;   // hero = container we animate
const S = { t: 0, action: "idle", actT: 0, jumpT: -1, sleeping: false, sick: false, ready: false, baseY: 0, faceY: 0 };
const SKY = { day: "#bfe9ff", dawn: "#ffd9b0", dusk: "#f0b3c8", night: "#2a2f6b" };

L.init(0,0).then(start).catch((e)=>console.error(e));

function start() {
  L.stage.scaleMode = Stage.SCALE_FULL; L.stage.screenMode = Stage.SCREEN_NONE; L.stage.bgColor = "#bfe9ff";
  scene = L.stage.addChild(new Scene3D());
  camera = scene.addChild(new Camera(0, 0.1, 100));
  setPos(camera, 0, 2.0, 5.1); setRot(camera, -10, 0, 0); camera.clearColor = col("#bfe9ff");
  const light = scene.addChild(new Sprite3D()); light.addComponent(DirectionLightCom);
  const lm = light.transform.worldMatrix; lm.setForward(new Vector3(-0.4,-1,-0.5)); light.transform.worldMatrix = lm;
  const fill = scene.addChild(new Sprite3D()); const fdl = fill.addComponent(DirectionLightCom);
  try { fdl.color = new Color(0.5,0.55,0.65,1); } catch(e){}
  const fm = fill.transform.worldMatrix; fm.setForward(new Vector3(0.6,-0.1,0.6)); fill.transform.worldMatrix = fm;

  Object.assign(M, { grass: mat("#6cc24a"), matC: mat("#7bd3ef"), trunk: mat("#9c6b3f"), leaf: mat("#3fae4f"), leaf2: mat("#59c463"), bowl: mat("#ff8f3f"), ball: mat("#ff5a5f") });
  buildScene();

  L.loader.load("doluruu.glb").then(() => {
    hero = new Sprite3D(); scene.addChild(hero);
    let model;
    try { model = Loader.createNodes("doluruu.glb"); } catch (e) { console.error("createNodes", e); }
    if (model) {
      hero.addChild(model);
      setRot(model, -90, 0, 0);      // Z-up → Y-up; front (-Y) now faces +Z (camera)
      setPos(model, -0.10, 0, 0);    // centre it on X
      paintByName(model);
    } else console.error("model is null after load");
    S.ready = true;
    L.timer.frameLoop(1, null, update);
  }).catch((e) => console.error("glb load failed", e));

  L.stage.on(Event.MOUSE_DOWN, null, () => { if (S.ready && !S.sleeping) { S.action = "play"; S.actT = 0; S.jumpT = 0; } try { parent.postMessage({ __pet3d: true, type: "poke" }, "*"); } catch(e){} });
  window.addEventListener("message", (e) => {
    const d = e.data || {}; if (!d || !d.__pet3d) return;
    if (d.type === "act") { const a = d.action; if (a === "wake") { S.sleeping = false; S.action = "idle"; } else if (a === "sleep") { S.sleeping = true; S.action = "sleep"; } else { S.action = a; S.actT = 0; if (a === "play") S.jumpT = 0; } }
    if (d.type === "state") { S.sleeping = !!d.sleeping; S.sick = !!d.sick; if (S.sleeping && S.action === "idle") S.action = "sleep"; }
    if (d.type === "phase" && SKY[d.phase]) camera.clearColor = col(SKY[d.phase]);
  });
  try { parent.postMessage({ __pet3d: true, type: "ready" }, "*"); } catch(e){}
}

// The glTF import drops vertex colors, but every part is named — so paint each
// part with the correct Doluruu palette (lit PBR, cached per colour).
const _matCache = {};
function pmat(hex) { if (_matCache[hex]) return _matCache[hex]; const m = new PBRStandardMaterial(); m.albedoColor = col(hex); try { m.metallic = 0; m.smoothness = 0.22; } catch(e){} return (_matCache[hex] = m); }
function colorFor(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("belly_border")) return "#2f8f6b";
  if (n.includes("belly") || n.includes("upper_plate")) return "#f0cf8d";
  if (n.includes("shell_rim")) return "#553872";
  if (n.includes("shell")) return "#6b4a8c";
  if (n.includes("eye_white") || n.includes("glint")) return "#ffffff";
  if (n.includes("iris")) return "#1f7a68";
  if (n.includes("pupil")) return "#141414";
  if (n.includes("forehead")) return "#d9542f";
  if (n.includes("head_spike")) { const i = parseInt(n.replace(/[^0-9]/g, "")) || 0; return ["#e0673a","#e8c15a","#2fae9e","#d9542f","#e8c15a","#2fae9e"][i % 6]; }
  if (n.includes("tail_spike")) { const i = parseInt(n.replace(/[^0-9]/g, "")) || 0; return ["#e0673a","#2fae9e","#6b4a8c"][i % 3]; }
  if (n.includes("nostril")) return "#201f1b";
  if (n.includes("brow")) return "#2a2925";
  return "#3c3b36"; // body default (charcoal)
}
function paintByName(node) {
  let r = null; try { r = node.getComponent(L.MeshRenderer); } catch (e) {}
  if (r) { try { r.sharedMaterial = pmat(colorFor(node.name)); } catch (e) { console.error("paint", e); } }
  const n = node.numChildren || 0;
  for (let i = 0; i < n; i++) paintByName(node.getChildAt(i));
}

function box(p,m,w,h,d){const s=p.addChild(new MeshSprite3D(PrimitiveMesh.createBox(w,h,d)));s.meshRenderer.material=m;return s;}
function sph(p,m,r){const s=p.addChild(new MeshSprite3D(PrimitiveMesh.createSphere(r,18,18)));s.meshRenderer.material=m;return s;}
function cyl(p,m,r,h){const s=p.addChild(new MeshSprite3D(PrimitiveMesh.createCylinder(r,h,20)));s.meshRenderer.material=m;return s;}
function tree(x,z){ const t=scene.addChild(new Sprite3D()); setPos(t,x,0,z);
  box(t,M.trunk,0.4,1.6,0.4).transform.localPosition=new Vector3(0,0.8,0);
  const a=sph(t,M.leaf,1.2); setPos(a,0,2.3,0); setScl(a,1,0.9,1);
  const b=sph(t,M.leaf2,0.8); setPos(b,0.5,3,0.2); }
function buildScene() {
  const g = box(scene, M.grass, 40, 0.5, 40); setPos(g, 0, -0.25, -5);
  const m = cyl(scene, M.matC, 2.5, 0.12); setPos(m, 0, 0.02, 0.2);
  tree(-3.6,-3.5); tree(3.7,-3.8); tree(-5.2,-6.5); tree(5.2,-6.5);
  cyl(scene, M.bowl, 0.5, 0.35).transform.localPosition = new Vector3(-2.2, 0.2, 0.7);
  sph(scene, M.ball, 0.42).transform.localPosition = new Vector3(2.2, 0.42, 0.7);
}

function update() {
  if (!S.ready) return;
  let dt = L.timer.delta/1000; if (dt>0.05) dt=0.05;
  S.t += dt;
  if (S.action!=="idle" && S.action!=="sleep"){ S.actT+=dt; if (S.actT>1.4){ S.action = S.sleeping ? "sleep" : "idle"; S.actT=0; } }
  animate(dt);
}
function animate(dt) {
  let bobY = Math.sin(S.t*2.2)*0.05;            // gentle breathing bob
  let swayY = Math.sin(S.t*0.7)*6;               // look side to side
  let rockZ = Math.sin(S.t*0.9)*1.5, jump = 0, sq = 1 + Math.sin(S.t*2.2)*0.03;

  if (S.action==="feed"){ bobY += Math.abs(Math.sin(S.actT*16))*0.12; }
  if (S.action==="play"){ if (S.jumpT>=0){ S.jumpT+=L.timer.delta; const p=Math.min(1,S.jumpT/1400); jump=Math.abs(Math.sin(p*Math.PI*2))*0.5; if(p>=1)S.jumpT=-1; } swayY=Math.sin(S.actT*10)*22; rockZ=Math.sin(S.actT*12)*6; }
  if (S.action==="bath"){ rockZ=Math.sin(S.actT*28)*7; }
  if (S.action==="sleep" || S.sleeping){ rockZ=-14; swayY=22; bobY=-0.1+Math.sin(S.t*1.4)*0.02; sq=1+Math.sin(S.t*1.4)*0.02; }

  setPos(hero, 0, 0.0 + bobY + jump, -0.5);
  setRot(hero, 0, swayY, rockZ);
  setScl(hero, 1.3, 1.3*sq, 1.3);
}
</script>
</body>
</html>
