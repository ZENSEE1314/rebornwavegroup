  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="560" y="205" font-size="26" font-weight="600" letter-spacing="7" fill="#28e0e6">ONE PLATFORM · EVERY BUSINESS</text>
    <text x="556" y="318" font-size="104" font-weight="700" fill="#eaf2ff">Bridge<tspan fill="url(#word)">X</tspan>POS</text>
    <text x="560" y="392" font-size="40" font-weight="600" fill="#eaf2ff">Your business. Your POS.</text>
    <text x="560" y="444" font-size="40" font-weight="600" fill="#eaf2ff">Your brand.</text>
    <text x="560" y="520" font-size="25" fill="#9fb2d4">POS · Member app · Staff · Inventory · WhatsApp</text>
