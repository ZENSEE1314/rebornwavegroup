<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28e0e6"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1fb4e6"/>
      <stop offset="1" stop-color="#5ff2ee"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8bff"/>
      <stop offset="1" stop-color="#1f47d6"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#28e0e6"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.25" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#1b46c9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#02040c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#6a3df0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#02040c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.9" cy="0.05" r="0.45">
      <stop offset="0" stop-color="#1fb4c8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#02040c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#6eaaff" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#02040c"/>
  <rect width="1200" height="630" fill="url(#blue)"/>
  <rect width="1200" height="630" fill="url(#violet)"/>
  <rect width="1200" height="630" fill="url(#cyan)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(70 95) scale(6.9)">
    <circle cx="32" cy="32" r="27" fill="#0a1c52" fill-opacity="0.55"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ring)" stroke-width="2.6"/>
    <circle cx="32" cy="32" r="21.5" fill="none" stroke="#3fb8ff" stroke-opacity="0.45" stroke-width="0.5"/>
    <path d="M15 17 C25 20 34 30 49 48" fill="none" stroke="url(#fall)" stroke-width="8" stroke-linecap="round"/>
    <path d="M15 48 C27 45 34 26 49 17" fill="none" stroke="#040a1c" stroke-width="11" stroke-linecap="round" opacity="0.5"/>
    <path d="M15 48 C27 45 34 26 49 17" fill="none" stroke="url(#rise)" stroke-width="8" stroke-linecap="round"/>
    <path d="M17 47.3 C28 44 34.5 26.5 47 18" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3.4" opacity="0.9"/>
    <g fill="#7fe9ff">
      <circle cx="32" cy="6" r="2.4"/><circle cx="54.5" cy="19" r="2"/><circle cx="54.5" cy="45" r="2"/>
      <circle cx="32" cy="58" r="2.4"/><circle cx="9.5" cy="45" r="2"/><circle cx="9.5" cy="19" r="2"/>
    </g>
