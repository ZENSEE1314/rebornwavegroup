plugins {
    id 'com.android.application'
}

android {
    namespace 'group.rebornwave.tvoverlay'
    compileSdk 34

    defaultConfig {
        applicationId "group.rebornwave.tvoverlay"
        minSdk 21
        targetSdk 33
        versionCode 36
        versionName "2.22"
        // The club's box key, given only to the private build (the workflow sets BOX_KEY from a secret): the box then links itself, with no code to type.
        // The private app (built with the club's key) is the whole karaoke app and is called that, so it is easy to tell from the overlay-only app.
        manifestPlaceholders = [appLabel: (System.getenv('BOX_KEY') ? 'Reborn Karaoke' : 'Reborn TV Overlay')]
        buildConfigField 'String', 'BOX_KEY', "\"${System.getenv('BOX_KEY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    // The same key every build (the workflow keeps it), so a newer build installs over the older one on the box.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // Media3's audio and track classes are marked unstable; lint would stop the release build over that warning.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The built-in karaoke player (PlayerActivity) plays the song videos with Media3 ExoPlayer.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
}
