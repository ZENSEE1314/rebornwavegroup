plugins {
    id 'com.android.application'
}

android {
    namespace 'group.rebornwave.tvoverlay'
    compileSdk 34

    defaultConfig {
        applicationId "group.rebornwave.tvoverlay"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    // The same key every build (the workflow keeps it), so a newer build installs over the older one on the box.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
